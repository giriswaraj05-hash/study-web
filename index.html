<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUICK LEARN DCST</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        /* ব্লু থিম ব্যাকগ্রাউন্ড */
        body { background: linear-gradient(135deg, #1e293b, #0f172a); color: #ffffff; min-height: 100vh; }
        .main-wrapper { display: flex; flex-direction: column; align-items: center; padding: 20px; text-align: center; }

        /* ঘড়ি স্টাইল */
        .clock-container { background: #ffffff; color: #0f172a; padding: 15px; border-radius: 20px; margin-bottom: 20px; cursor: pointer; width: 100%; max-width: 300px; transition: transform 0.2s; }
        .clock-container:hover { transform: scale(1.05); }
        #live-time { font-size: 24px; font-weight: bold; font-family: monospace; }
        .date-text { font-size: 10px; text-transform: uppercase; margin-top: 5px; color: #64748b; }

        /* বড় ঘড়ির মোডাল */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 1000; align-items: center; justify-content: center; flex-direction: column; }
        #big-time { font-size: 80px; color: #38bdf8; font-weight: bold; font-family: monospace; }
        .close-btn { position: absolute; top: 20px; right: 20px; color: white; cursor: pointer; font-size: 20px; padding: 10px; }

        /* টাইপরাইটার অ্যানিমেশন */
        #typing-text { 
            font-size: 24px; font-weight: bold; display: inline-block; white-space: nowrap; overflow: hidden; color: #38bdf8;
            animation: typing 3s steps(20, end); margin-bottom: 5px; 
        }
        @keyframes typing { from { width: 0; } to { width: 100%; } }

        /* কার্ড ও বাটন স্টাইল */
        .badge { background: #38bdf8; color: #0f172a; padding: 8px 20px; border-radius: 50px; font-size: 12px; font-weight: bold; margin-bottom: 20px; }
        .stats-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); display: flex; justify-content: space-around; width: 100%; max-width: 300px; padding: 15px; border-radius: 20px; margin-bottom: 20px; }
        .get-started-btn { background: #38bdf8; color: #0f172a; padding: 12px 30px; border-radius: 30px; text-decoration: none; font-weight: bold; margin-bottom: 15px; }
        
        /* পাম্পিং ইন্সটল বাটন */
        .install-btn { 
            background: transparent; color: #38bdf8; border: 2px solid #38bdf8; 
            padding: 12px 30px; border-radius: 30px; cursor: pointer; font-weight: bold; margin-top: 20px; 
            animation: pump 2s infinite; 
        }
        @keyframes pump { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="clock-container" onclick="openBigClock()">
            <div id="live-time">00:00:00</div>
            <div class="date-text" id="live-date">Loading...</div>
        </div>

        <div id="clockModal" class="modal">
            <div class="close-btn" onclick="closeBigClock()">BACK</div>
            <div id="big-time">00:00:00</div>
        </div>

        <div class="badge">🚀 5TH SEMESTER UPDATE</div>
        <div style="font-size: 50px; margin: 15px 0;">💻</div>

        <h1 id="typing-text">QUICK LEARN DCST</h1>
        <p style="color: #94a3b8;">Smart way to master your subjects.</p>

        <div class="stats-card">
            <div class="stat-item"><h2>5</h2><p>SUBJECTS</p></div>
            <div class="stat-item"><h2>31</h2><p>UNITS</p></div>
            <div class="stat-item"><h2>25</h2><p>PYQS</p></div>
        </div>

        <a href="subject.html" class="get-started-btn">Get Started</a>
        <button class="install-btn" id="installBtn">Install App</button>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { hour12: true });
            const dateString = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            document.getElementById('live-time').innerHTML = timeString;
            document.getElementById('live-date').innerHTML = dateString;
            document.getElementById('big-time').innerHTML = timeString;
        }
        function openBigClock() { document.getElementById('clockModal').style.display = 'flex'; }
        function closeBigClock() { document.getElementById('clockModal').style.display = 'none'; }
        setInterval(updateTime, 1000);
        updateTime();

        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });
        installBtn.addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
            } else {
                alert("অ্যাপটি ইন্সটল করার জন্য ব্রাউজারটি সাপোর্ট করছে না!");
            }
        });
    </script>
</body>
</html>
