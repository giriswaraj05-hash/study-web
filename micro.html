<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Microprocessor Hub</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: linear-gradient(135deg, #1e293b, #0f172a); color:#fff; font-family:'Segoe UI',sans-serif; min-height:100vh; padding:20px 16px 40px; }
    .back-btn { display:inline-block; color:#f5a623; font-weight:700; font-size:15px; text-decoration:none; margin-bottom:18px; }
    .page-header { text-align:center; margin-bottom:28px; }
    .page-header .icon { font-size:44px; margin-bottom:8px; }
    .page-header h1 { font-size:24px; font-weight:800; color:#f5a623; letter-spacing:1px; }
    .page-header p { color:#8a9bb0; font-size:13px; margin-top:4px; }

    .hub-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .hub-btn {
      background:#162032; border:2px solid #2a3a50; border-radius:16px;
      padding:24px 10px; text-align:center; cursor:pointer;
      transition:all 0.2s; text-decoration:none; display:block;
    }
    .hub-btn:active { transform:scale(0.95); }
    .hub-btn .btn-icon { font-size:30px; margin-bottom:10px; }
    .hub-btn .btn-label { font-size:13px; font-weight:700; color:#e0e0e0; text-transform:uppercase; letter-spacing:0.5px; }
    .hub-btn:hover { border-color:#f5a623; background:#1e2f45; box-shadow:0 0 18px rgba(245,166,35,0.25); }
    .hub-btn:hover .btn-label { color:#f5a623; }
  </style>
</head>
<body>
  <a class="back-btn" href="subject.html">← BACK</a>
  <div class="page-header">
    <div class="icon">⚙️</div>
    <h1>MICROPROCESSOR</h1>
    <p>5th Semester • CST Department</p>
  </div>
  <div class="hub-grid">
    <a href="micro_units.html" class="hub-btn">
      <div class="btn-icon">📚</div>
      <div class="btn-label">Units</div>
    </a>
    <a href="micro_pyq.html" class="hub-btn">
      <div class="btn-icon">📝</div>
      <div class="btn-label">PYQ</div>
    </a>
    <a href="micro_answers.html" class="hub-btn">
      <div class="btn-icon">✅</div>
      <div class="btn-label">PYQ Answer</div>
    </a>
    <a href="micro_notes.html" class="hub-btn">
      <div class="btn-icon">🗒️</div>
      <div class="btn-label">Notes</div>
    </a>
  </div>
</body>
</html>
