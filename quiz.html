<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>PYQ Quiz</title> <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"> <style> :root { --bg: #060b18; --surface: #0d1526; --purple: #aa00ff; --purple-soft: #c084fc; --gold: #f5c518; --cyan: #00e5ff; --green: #00e676; --text: #e2eafc; --muted: #5a6e8a; } * { margin: 0; padding: 0; box-sizing: border-box; } body { background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; min-height: 100vh; } body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(124,58,237,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(124,58,237,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; } /* ===== PAGE SYSTEM ===== */ .page { display: none; } .page.active { display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 24px 18px; } .container { max-width: 480px; width: 100%; position: relative; z-index: 1; } /* ===== SELECT PAGE ===== */ .header { text-align: center; margin-bottom: 32px; } .header-icon { font-size: 40px; display: block; margin-bottom: 12px; filter: drop-shadow(0 0 12px rgba(124,58,237,0.6)); animation: floatIcon 2s ease-in-out infinite alternate; } @keyframes floatIcon { from { transform: translateY(0); } to { transform: translateY(-6px); } } .header-label { font-size: 11px; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; } .header-title { font-family: 'Orbitron', monospace; font-size: 20px; font-weight: 900; background: linear-gradient(135deg, #fff 30%, var(--purple-soft) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 2px; } .header-sub { font-size: 13px; color: var(--muted); margin-top: 8px; } .header-line { width: 60px; height: 2px; background: linear-gradient(90deg, transparent, var(--purple-soft), transparent); margin: 12px auto 0; } .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; } .card { background: var(--surface); padding: 22px 12px 18px; border-radius: 18px; text-align: center; cursor: pointer; display: block; color: var(--text); position: relative; overflow: hidden; border: 1px solid rgba(124,58,237,0.2); transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s; animation: pulsePurple 3s ease-in-out infinite; } @keyframes pulsePurple { 0%, 100% { box-shadow: 0 0 6px rgba(124,58,237,0.1); border-color: rgba(124,58,237,0.2); } 50% { box-shadow: 0 0 18px rgba(124,58,237,0.35); border-color: rgba(124,58,237,0.5); } } .card:nth-child(2) { animation-delay: 0.5s; } .card:nth-child(3) { animation-delay: 1s; } .card:nth-child(4) { animation-delay: 1.5s; } .card:nth-child(5) { animation-delay: 2s; } .card:hover { transform: translateY(-5px); box-shadow: 0 12px 35px rgba(124,58,237,0.4); border-color: rgba(124,58,237,0.7); } .card.required { border-color: rgba(245,197,24,0.2); animation: pulseGold 3s ease-in-out infinite; } .card.required:hover { box-shadow: 0 12px 35px rgba(245,197,24,0.2); border-color: rgba(245,197,24,0.6); } @keyframes pulseGold { 0%, 100% { box-shadow: 0 0 6px rgba(245,197,24,0.1); border-color: rgba(245,197,24,0.2); } 50% { box-shadow: 0 0 18px rgba(245,197,24,0.3); border-color: rgba(245,197,24,0.45); } } .card-icon { font-size: 30px; display: block; margin-bottom: 10px; filter: drop-shadow(0 0 8px rgba(124,58,237,0.5)); } .card.required .card-icon { filter: drop-shadow(0 0 8px rgba(245,197,24,0.5)); } .card-name { font-weight: 700; font-size: 14px; color: #c8d8f0; } .badge { font-size: 9px; font-family: 'Orbitron', monospace; letter-spacing: 1px; padding: 3px 9px; border-radius: 20px; display: inline-block; margin-top: 8px; font-weight: 700; } .badge-required { background: rgba(124,58,237,0.2); color: var(--purple-soft); border: 1px solid rgba(124,58,237,0.4); } .badge-optional { background: rgba(255,255,255,0.05); color: var(--muted); border: 1px solid rgba(255,255,255,0.08); } .back-btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--muted); padding: 14px; border-radius: 14px; text-decoration: none; font-weight: 700; font-size: 13px; letter-spacing: 1px; font-family: 'Orbitron', monospace; transition: all 0.25s; cursor: pointer; } .back-btn:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.2); color: var(--text); } /* ===== QUIZ PAGE ===== */ .quiz-header { margin-bottom: 24px; } .quiz-subject-label { font-family: 'Orbitron', monospace; font-size: 11px; letter-spacing: 3px; color: var(--purple-soft); text-transform: uppercase; margin-bottom: 4px; } .quiz-progress-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; } .progress-bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-bottom: 24px; overflow: hidden; } .progress-fill { height: 100%; background: linear-gradient(90deg, #7c3aed, #aa00ff); border-radius: 2px; transition: width 0.4s ease; } .question-text { font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 24px; line-height: 1.5; } .option { background: var(--surface); border: 1.5px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 14px 18px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 14px; font-size: 15px; color: var(--text); transition: all 0.2s; } .option:hover { border-color: rgba(124,58,237,0.5); background: rgba(124,58,237,0.08); } .option.correct { border-color: var(--green); background: rgba(0,230,118,0.1); color: var(--green); } .option.wrong { border-color: #ef4444; background: rgba(239,68,68,0.1); color: #ef4444; } .option-letter { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', monospace; font-size: 12px; font-weight: 700; flex-shrink: 0; } .next-btn { width: 100%; margin-top: 16px; padding: 16px; border-radius: 14px; border: none; background: linear-gradient(135deg, #7c3aed, #aa00ff); color: white; font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; cursor: pointer; display: none; transition: all 0.2s; } .next-btn.show { display: block; } .next-btn:hover { box-shadow: 0 6px 24px rgba(124,58,237,0.5); } /* ===== RESULT PAGE ===== */ .result-box { text-align: center; padding: 20px 0; } .result-emoji { font-size: 64px; margin-bottom: 16px; display: block; } .result-score { font-family: 'Orbitron', monospace; font-size: 40px; font-weight: 900; color: #fff; margin-bottom: 8px; } .result-pct { font-family: 'Orbitron', monospace; font-size: 20px; color: var(--purple-soft); margin-bottom: 16px; } .result-msg { font-size: 15px; color: var(--muted); margin-bottom: 32px; } .retry-btn { width: 100%; padding: 18px; border-radius: 18px; border: none; background: linear-gradient(135deg, #7c3aed, #aa00ff); color: white; font-family: 'Orbitron', monospace; font-size: 14px; font-weight: 700; letter-spacing: 2px; cursor: pointer; margin-bottom: 12px; transition: all 0.2s; } .retry-btn:hover { box-shadow: 0 8px 30px rgba(124,58,237,0.5); } .fade-up { opacity: 0; transform: translateY(18px); animation: fadeUp 0.5s ease forwards; } @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } } </style> </head> <body> <!-- PAGE 1: Subject Selection --> <div class="page active" id="page-select"> <div class="container"> <div class="header fade-up" style="animation-delay:0.05s;"> <span class="header-icon">🚀</span> <div class="header-label">Start Quiz</div> <div class="header-title">PYQ QUIZ</div> <p class="header-sub">কোন বিষয়ের Quiz দিতে চাও?</p> <div class="header-line"></div> </div> <div class="grid fade-up" style="animation-delay:0.15s;"> <div class="card required" onclick="startQuiz('microprocessor')"> <span class="card-icon">⚙️</span> <div class="card-name">Microprocessor</div> <span class="badge badge-required">REQUIRED</span> </div> <div class="card required" onclick="startQuiz('iot')"> <span class="card-icon">🌐</span> <div class="card-name">IoT</div> <span class="badge badge-required">REQUIRED</span> </div> <div class="card" onclick="startQuiz('elective1')"> <span class="card-icon">📱</span> <div class="card-name">Elective-1</div> <span class="badge badge-optional">OPTIONAL</span> </div> <div class="card" onclick="startQuiz('elective2')"> <span class="card-icon">🤖</span> <div class="card-name">Elective-2</div> <span class="badge badge-optional">OPTIONAL</span> </div> <div class="card" onclick="startQuiz('elective3')"> <span class="card-icon">💻</span> <div class="card-name">Elective-3</div> <span class="badge badge-optional">OPTIONAL</span> </div> </div> <a href="subject.html" class="back-btn fade-up" style="animation-delay:0.3s;">← BACK TO DASHBOARD</a> </div> </div> <!-- PAGE 2: Quiz --> <div class="page" id="page-quiz"> <div class="container"> <div class="quiz-header"> <div class="quiz-subject-label" id="quiz-subject-label">Microprocessor</div> <div class="quiz-progress-row"> <span id="q-counter">Question 1 of 5</span> <span id="q-score">Score: 0</span> </div> <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:20%"></div></div> </div> <div class="question-text" id="question-text"></div> <div id="options-container"></div> <button class="next-btn" id="next-btn" onclick="nextQuestion()">NEXT QUESTION →</button> </div> </div> <!-- PAGE 3: Result --> <div class="page" id="page-result"> <div class="container"> <div class="result-box"> <span class="result-emoji" id="result-emoji">🎉</span> <div class="result-score" id="result-score">0/5</div> <div class="result-pct" id="result-pct">0% Score</div> <div class="result-msg" id="result-msg"></div> <button class="retry-btn" onclick="retryQuiz()">🔄 আবার চেষ্টা করো</button> <a href="subject.html" class="back-btn" style="display:flex;">← BACK TO DASHBOARD</a> </div> </div> </div> <script> // ✅ এখানে তোমার নিজের questions যোগ করো const allQuestions = { microprocessor: [ { q: '8086 microprocessor-এর address bus কত bit?', opts: ['16-bit','20-bit','32-bit','8-bit'], ans: 1 }, { q: 'AX register-কে কী বলা হয়?', opts: ['Base register','Counter register','Accumulator','Stack Pointer'], ans: 2 }, { q: 'Stack-এ data কোন নিয়মে ঢোকে?', opts: ['FIFO','LIFO','Random','FILO'], ans: 1 }, { q: '8086-এর BIU-এর কাজ কী?', opts: ['Execute instructions','Fetch instructions','Store data','None'], ans: 1 }, { q: 'Interrupt vector table কোথায় থাকে?', opts: ['Memory 0000H-03FFH','Register','Cache','Stack'], ans: 0 }, ], iot: [ { q: 'IoT-এ সবচেয়ে বেশি ব্যবহৃত protocol কোনটি?', opts: ['HTTP','MQTT','FTP','SMTP'], ans: 1 }, { q: 'Arduino কী ধরনের device?', opts: ['Microcontroller board','Microprocessor','Laptop','Router'], ans: 0 }, { q: 'Raspberry Pi-তে কোন OS চলে?', opts: ['Windows only','Linux-based','Android only','iOS'], ans: 1 }, { q: 'IoT gateway-এর কাজ কী?', opts: ['Data store করা','Device ও cloud connect করা','Display করা','Power supply'], ans: 1 }, { q: 'Smart meter কোথায় ব্যবহার হয়?', opts: ['Hospital','Electricity grid','Airport','School'], ans: 1 }, ], elective1: [ { q: 'Android app কোন language-এ লেখা হয়?', opts: ['Python','Java/Kotlin','C++','Swift'], ans: 1 }, { q: 'APK file কোন platform-এ চলে?', opts: ['iOS','Android','Windows','Linux'], ans: 1 }, { q: 'Push notification কী?', opts: ['Email','Server থেকে app-এ message','Call','SMS'], ans: 1 }, ], elective2: [ { q: 'AI-এর full form কী?', opts: ['Automatic Intelligence','Artificial Intelligence','Advanced Internet','None'], ans: 1 }, { q: 'Supervised learning-এ কী দরকার?', opts: ['Unlabeled data','Labeled data','No data','Random data'], ans: 1 }, { q: 'Deep learning কোন structure ব্যবহার করে?', opts: ['Decision tree','Neural network','Graph','Table'], ans: 1 }, ], elective3: [ { q: 'Cloud-এর তিনটি service model কী?', opts: ['SaaS, PaaS, IaaS','AWS, Azure, GCP','HTTP, FTP, SMTP','None'], ans: 0 }, { q: 'AWS কোন company-র?', opts: ['Microsoft','Google','Amazon','Apple'], ans: 2 }, { q: 'Docker কী?', opts: ['Database','Container platform','Language','Browser'], ans: 1 }, ], }; const subjectNames = { microprocessor: 'Microprocessor', iot: 'IoT', elective1: 'Elective-1', elective2: 'Elective-2', elective3: 'Elective-3', }; let currentSubject = ''; let questions = []; let qIndex = 0; let score = 0; let answered = false; function showPage(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0, 0); } function startQuiz(subject) { currentSubject = subject; questions = allQuestions[subject] || []; qIndex = 0; score = 0; answered = false; document.getElementById('quiz-subject-label').textContent = subjectNames[subject]; showPage('page-quiz'); renderQuestion(); } function renderQuestion() { if (qIndex >= questions.length) { showResult(); return; } answered = false; const q = questions[qIndex]; const total = questions.length; document.getElementById('q-counter').textContent = `Question ${qIndex+1} of ${total}`; document.getElementById('q-score').textContent = `Score: ${score}`; document.getElementById('progress-fill').style.width = `${((qIndex+1)/total)*100}%`; document.getElementById('question-text').textContent = q.q; document.getElementById('next-btn').className = 'next-btn'; document.getElementById('next-btn').textContent = qIndex === questions.length - 1 ? 'RESULT দেখো 🎯' : 'NEXT QUESTION →'; const letters = ['A','B','C','D']; document.getElementById('options-container').innerHTML = q.opts.map((opt, i) => `<div class="option" id="opt-${i}" onclick="selectAnswer(${i})"> <div class="option-letter">${letters[i]}</div>${opt} </div>` ).join(''); } function selectAnswer(selected) { if (answered) return; answered = true; const q = questions[qIndex]; document.querySelectorAll('.option').forEach((el, i) => { if (i === q.ans) el.classList.add('correct'); else if (i === selected) el.classList.add('wrong'); }); if (selected === q.ans) score++; document.getElementById('q-score').textContent = `Score: ${score}`; document.getElementById('next-btn').classList.add('show'); } function nextQuestion() { qIndex++; renderQuestion(); } function showResult() { const total = questions.length; const pct = Math.round((score / total) * 100); document.getElementById('result-emoji').textContent = pct >= 80 ? '🎉' : pct >= 50 ? '👍' : '😅'; document.getElementById('result-score').textContent = `${score}/${total}`; document.getElementById('result-pct').textContent = `${pct}% Score`; document.getElementById('result-msg').textContent = pct >= 80 ? 'দারুণ! অসাধারণ পারফরম্যান্স!' : pct >= 50 ? 'ভালো! আরও একটু পড়লে আরও ভালো হবে।' : 'আরেকবার চেষ্টা করো, পারবে!'; showPage('page-result'); } function retryQuiz() { startQuiz(currentSubject); } </script> </body> </html>
