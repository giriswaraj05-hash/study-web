<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f1f5f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        
        .section-title { font-size: 16px; font-weight: 800; margin: 30px 0 15px; color: #94a3b8; text-transform: uppercase; border-bottom: 2px solid #334155; padding-bottom: 8px; text-align: center; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        /* Subject Boxes */
        .subject-box { background: #1e293b; padding: 20px; border-radius: 20px; margin-bottom: 15px; border: 1px solid #facc15; }
        .sub-link { text-decoration: none; color: #facc15; font-weight: bold; font-size: 17px; display: flex; justify-content: space-between; margin-bottom: 15px; }
        .compulsory-badge { font-size: 10px; background: #facc15; color: #0f172a; padding: 3px 8px; border-radius: 6px; font-weight: 800; }
        .syllabus-btn { background: #2563eb; color: white; padding: 10px; border-radius: 10px; text-align: center; text-decoration: none; display: block; font-size: 13px; }
        
        /* Cards */
        .subject-card { background: #1e293b; padding: 18px 10px; border-radius: 20px; text-align: center; border: 1px solid #38bdf8; text-decoration: none; display: block; color: #cbd5e1; transition: 0.3s; }
        .subject-card:hover { border-color: #facc15; transform: scale(1.02); }
        .name { font-weight: 600; font-size: 13px; margin-top: 8px; }
        .optional-badge { font-size: 9px; background: #334155; color: #94a3b8; padding: 2px 6px; border-radius: 5px; display: inline-block; margin-top: 5px; }
        
        .lab-card { background: linear-gradient(145deg, #2e1065, #1e1b4b); padding: 20px; border-radius: 20px; text-align: center; border: 2px solid #a855f7; display: block; text-decoration: none; }
        .lab-name { font-weight: 800; font-size: 13px; margin-top: 8px; color: #e9d5ff; }

        .unique-quiz-btn { background: linear-gradient(45deg, #a855f7, #6366f1); color: white; padding: 16px; border-radius: 18px; border: none; font-weight: 800; font-size: 15px; cursor: pointer; width: 100%; margin: 20px 0; }
        .chat-btn { display: block; background: #0f172a; border: 1px solid #10b981; color: #10b981; text-align: center; padding: 15px; border-radius: 18px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align:center; margin-bottom:25px;">SUBJECT DASHBOARD</h1>

    <div class="subject-box">
        <a href="micro.html" class="sub-link"><span>⚙️ Microprocessor</span><span class="compulsory-badge">REQUIRED</span></a>
        <a href="syllabus_micro.html" class="syllabus-btn">FULL SYLLABUS ⏩</a>
    </div>
    
    <div class="subject-box">
        <a href="iot.html" class="sub-link"><span>🌐 IoT</span><span class="compulsory-badge">REQUIRED</span></a>
        <a href="syllabus_iot.html" class="syllabus-btn">FULL SYLLABUS ⏩</a>
    </div>

    <div class="grid-container">
        <a href="elective1.html" class="subject-card"><span>📱</span><div class="name">Elective-1</div><span class="optional-badge">Optional</span></a>
        <a href="elective2.html" class="subject-card"><span>🤖</span><div class="name">Elective-2</div><span class="optional-badge">Optional</span></a>
        <a href="elective3.html" class="subject-card"><span>💻</span><div class="name">Elective-3</div><span class="optional-badge">Optional</span></a>
        <a href="lab.html" class="lab-card"><span>🛠️</span><div class="lab-name">MP & MC LAB</div></a>
    </div>

    <h2 class="section-title">PREPARATION</h2>
    <div class="grid-container">
        <a href="pyq_questions.html" class="subject-card"><span>📝</span><div class="name">PYQ QUESTIONS</div></a>
        <a href="pyq_answers.html" class="subject-card"><span>📖</span><div class="name">PYQ ANSWERS</div></a>
    </div>

    <button class="unique-quiz-btn">🚀 START PYQ QUIZ</button>
    <a href="chat.html" class="chat-btn">💬 JOIN DISCUSSION GROUP</a>
</div>

</body>
</html>
