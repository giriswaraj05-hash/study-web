<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Subjects</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #0f172a; color: #f1f5f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        h1 { font-size: 20px; margin-bottom: 25px; color: #ffffff; text-align: center; }
        
        .schedule-title { 
            font-size: 18px; color: #ffffff; letter-spacing: 1px; 
            text-transform: uppercase; border-bottom: 2px solid #334155; 
            display: inline-block; padding-bottom: 5px; margin-top: 30px; margin-bottom: 15px; 
        }
        
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .subject-card { 
            background: #1e293b; padding: 15px; border-radius: 20px; 
            text-align: center; border: 1px solid #334155;
            display: flex; flex-direction: column; align-items: center;
            transition: transform 0.2s;
        }
        .subject-card:hover { transform: scale(1.02); }
        .icon { font-size: 30px; margin-bottom: 10px; }
        .name { font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #facc15; }
        .optional { font-size: 10px; color: #94a3b8; line-height: 1.3; }
        
        .back-btn { 
            display: block; text-align: center; margin-top: 30px; 
            color: #facc15; text-decoration: none; font-weight: bold; font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ALL SUBJECTS</h1>

    <div class="grid-container">
        <div class="subject-card">
            <span class="icon">⚙️</span>
            <div class="name">Microprocessor</div>
            <div class="optional">COPC301</div>
        </div>
        
        <div class="subject-card">
            <span class="icon">🌐</span>
            <div class="name">IoT</div>
            <div class="optional">COPC303</div>
        </div>

        <a href="elective1.html" style="text-decoration:none; display:block;">
            <div class="subject-card">
                <span class="icon">📱</span>
                <div class="name">Elective-1</div>
                <div class="optional">Mobile / ACN</div>
            </div>
        </a>

        <a href="elective2.html" style="text-decoration:none; display:block;">
            <div class="subject-card">
                <span class="icon">🤖</span>
                <div class="name">Elective-2</div>
                <div class="optional">Automata / AI</div>
            </div>
        </a>

        <a href="elective3.html" style="text-decoration:none; display:block;">
            <div class="subject-card">
                <span class="icon">💻</span>
                <div class="name">Elective-3</div>
                <div class="optional">Graphics / Image</div>
            </div>
        </a>

        <div class="subject-card">
            <span class="icon">🛠️</span>
            <div class="name">Lab & Project</div>
            <div class="optional">Micro processor & micro contronar Lab</div>
        </div>
    </div>

    <div style="text-align: center;">
        <h2 class="schedule-title">Class Schedule</h2>
    </div>

    <div class="grid-container">
        <a href="teachers.html" style="text-decoration:none; display:block;">
            <div class="subject-card">
                <span class="icon">👨‍🏫</span>
                <div class="name">TEACHERS LIST</div>
            </div>
        </a>

        <a href="routine.html" style="text-decoration:none; display:block;">
            <div class="subject-card">
                <span class="icon">📅</span>
                <div class="name">CLASS ROUTINE</div>
            </div>
        </a>
    </div>

    <a href="index.html" class="back-btn">← BACK TO HOME</a>
</div>

</body>
</html>
