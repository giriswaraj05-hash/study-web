<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Subject Dashboard</title> <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"> <style> :root { --bg: #060b18; --surface: #0d1526; --gold: #f5c518; --blue: #2979ff; --cyan: #00e5ff; --purple: #aa00ff; --green: #00e676; --text: #e2eafc; --muted: #5a6e8a; } * { margin: 0; padding: 0; box-sizing: border-box; } body { background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; min-height: 100vh; } body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(41,121,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(41,121,255,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; } .container { max-width: 480px; margin: 0 auto; padding: 24px 18px 40px; position: relative; z-index: 1; } .header { text-align: center; margin-bottom: 32px; padding-top: 8px; } .header-label { font-size: 11px; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; } .header-title { font-family: 'Orbitron', monospace; font-size: 22px; font-weight: 900; background: linear-gradient(135deg, #fff 30%, var(--cyan) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 2px; } .header-line { width: 60px; height: 2px; background: linear-gradient(90deg, transparent, var(--cyan), transparent); margin: 10px auto 0; } .subject-box { background: var(--surface); border-radius: 18px; padding: 18px 18px 16px; margin-bottom: 14px; border: 1px solid rgba(245,197,24,0.25); position: relative; overflow: hidden; transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s; } .subject-box::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(245,197,24,0.04) 0
